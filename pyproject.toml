[project]
name = "confluence-md-exporter"
version = "1.0.0"
description = "Local read-only export of Confluence Server/Data Center pages to Markdown"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
authors = [
    { name = "gste", email = "ghostegor@gmail.com" },
]
keywords = [
    "confluence",
    "markdown",
    "export",
    "datacenter",
    "wiki",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Text Processing :: Markup",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/gste/confluence-md-exporter"
Repository = "https://github.com/gste/confluence-md-exporter"
Issues = "https://github.com/gste/confluence-md-exporter/issues"
Changelog = "https://github.com/gste/confluence-md-exporter/blob/master/CHANGELOG.md"

[project.scripts]
confluence-md-exporter = "confluence_md_exporter.cli:entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/confluence_md_exporter"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.cursor",
    "/.github",
    "/docs",
    "/AGENTS.md",
    "/TODO.md",
    "/uv.lock",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
